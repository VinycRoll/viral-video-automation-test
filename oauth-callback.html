<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth Callback — Reels Pipeline</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 24px;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 1.4rem; }
  .box {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 24px;
    margin-top: 24px;
    word-break: break-all;
  }
  .label { color: #666; font-size: 0.85rem; margin-bottom: 4px; }
  .value {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.95rem;
    background: #f0f0f0;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    user-select: all;
  }
  button {
    background: #000;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .empty { color: #888; }
</style>
</head>
<body>
  <h1>TikTok Authorization Callback</h1>
  <p>Copy the values below back to Claude or your Make scenario.</p>

  <div class="box" id="result">
    <p class="empty">Reading parameters…</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    const box = document.getElementById('result');

    function row(label, value) {
      return `<div class="label">${label}</div><div class="value" onclick="this.focus()" tabindex="0">${value}</div>`;
    }

    let html = '';
    if (error) {
      html += row('Error', error);
      if (errorDesc) html += row('Error description', errorDesc);
    } else if (code) {
      html += row('Authorization code', code);
      if (state) html += row('State', state);
      html += '<button onclick="navigator.clipboard.writeText(document.querySelector(\'.value\').innerText)">Copy code</button>';
    } else {
      html = '<p class="empty">No code or error parameter found in the URL.</p>';
    }
    box.innerHTML = html;
  </script>
</body>
</html>
